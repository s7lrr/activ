
name: Build Presence Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name PresenceStudio main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Find Installer Script
        id: find_iss
        shell: pwsh
        run: |
          $iss = Get-ChildItem -Path . -Recurse -File -Filter "PresenceStudio.iss" |
            Select-Object -First 1

          if (-not $iss) {
            throw "PresenceStudio.iss was not found in the repository"
          }

          "iss_path=$($iss.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Found: $($iss.FullName)"

      - name: Build Installer
        shell: pwsh
        run: |
          $iss = "${{ steps.find_iss.outputs.iss_path }}"
          iscc "$iss"

      - name: Find Installer Output
        id: find_output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -File -Filter "PresenceStudio-Setup.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "PresenceStudio-Setup.exe was not generated. Check the OutputDir and OutputBaseFilename in PresenceStudio.iss"
          }

          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($exe.FullName)"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: PresenceStudio-Setup
          path: ${{ steps.find_output.outputs.exe_path }}
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_output.outputs.exe_path }}
